services:
  - type: web
    name: poojashriee-ai-medicare
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/patients.db
    healthCheckPath: /dashboard
